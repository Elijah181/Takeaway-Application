<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart</title>
</head>
<body>
    <a href="{{url_for('cart_to_menu')}}">Go Back To Menu</a>
    <ul>
        {% if items_name_amount | length == 0 %}
            <p>Your cart is empty. Please order items from the menu.</p>
        {% else %}
            {% for item, quantity in items_name_amount.items() %}
            <li><strong>{{ item }}: </strong>{{ quantity }}: {{ item_price[loop.index0] }}</li>
        {% endfor %}
        {% endif %}
    </ul>
</body>
</html>
